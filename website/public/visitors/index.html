<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Visitors · RT-SAFE</title>
  <meta name="description" content="Explore the approximate locations of readers visiting RT-SAFE around the world.">
  <link rel="canonical" href="https://xtrose29.github.io/RT-SAFE/visitors/">
  <link rel="icon" href="../simworld-icon.png" type="image/png">
  <link rel="stylesheet" href="../fonts/fonts.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6f5f1; color: #202d2c; font-family: 'DM Sans', system-ui, sans-serif; }
    a { color: #315c4e; text-underline-offset: 4px; }
    a:focus-visible { outline: 3px solid #315c4e; outline-offset: 5px; }
    nav { padding: 22px max(24px, calc((100% - 1080px) / 2)); border-bottom: 1px solid #dcded5; }
    nav a { font-weight: 600; text-decoration: none; }
    main { max-width: 1080px; margin: 0 auto; padding: 52px 24px; text-align: center; }
    .eyebrow { color: #315c4e; font-size: 12px; letter-spacing: .16em; font-weight: 600; }
    h1 { font-family: 'Space Grotesk', system-ui, sans-serif; font-size: clamp(36px, 6vw, 56px); margin: 12px 0; letter-spacing: -.04em; }
    h1::after { content: ''; display: block; width: 64px; height: 4px; margin: 20px auto; background: #315c4e; border-radius: 4px; }
    .intro, .note { color: #65716a; }
    .map-card { margin: 32px 0 20px; padding: 18px; border: 1px solid #dcded5; border-radius: 16px; background: #fff; overflow: hidden; min-height: 180px; }
    .map-card img { max-width: 100%; height: auto; }
    .note { font-size: 13px; line-height: 1.6; }
    @media(max-width: 600px) { main { padding: 32px 16px; } .map-card { padding: 10px; } }
  </style>
</head>
<body>
  <nav aria-label="Project"><a href="../">← RT–SAFE</a></nav>
  <main>
    <p class="eyebrow">AROUND THE WORLD</p>
    <h1>Visitors</h1>
    <p class="intro">Where readers discover RT–SAFE.</p>
    <div class="map-card">
      <script id="mapmyvisitors" src="https://mapmyvisitors.com/map.js?d=kNtYbeOheyyz0CfffFgFNov_OGiFVuRgFJMPuBrFc-M&amp;cl=ffffff&amp;w=a"></script>
      <noscript><a href="https://mapmyvisitors.com/web/1c8s2"><img src="https://mapmyvisitors.com/map.png?d=kNtYbeOheyyz0CfffFgFNov_OGiFVuRgFJMPuBrFc-M&amp;cl=ffffff" alt="Map of approximate RT-SAFE visitor locations"></a></noscript>
    </div>
    <p class="note">Locations are approximate and do not identify individual visitors.</p>
    <p><a href="https://mapmyvisitors.com/web/1c8s2" target="_blank" rel="noopener noreferrer">View visitor statistics ↗</a></p>
  </main>
</body>
</html>
