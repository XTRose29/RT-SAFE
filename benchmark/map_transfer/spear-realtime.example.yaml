# Supply the matching local SPEAR SDK. Launch the owned editor with this file
# through the map-transfer launch command, which expands SDK defaults.
# Do not pass this partial override file directly to the Unreal executable.
SPEAR:
  LAUNCH_MODE: none
  INSTANCE:
    CLIENT_INTERNAL_TIMEOUT_SECONDS: 60.0
SP_SERVICES:
  RPC_SERVICE:
    RPC_SERVER_PORT: 47834
    RPC_BIND_RETRY_COUNT: 3
    RPC_BIND_RETRY_DELAY_SEC: 1.0
  ENGINE_SERVICE:
    STEPPING_MODE: async
  INITIALIZE_ENGINE_SERVICE:
    OVERRIDE_BENCHMARKING: true
    BENCHMARKING: false
    OVERRIDE_FIXED_DELTA_TIME: false
  WORLD_REGISTRY_SERVICE:
    OVERRIDE_GAME_PAUSED: false
